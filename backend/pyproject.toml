[project]
name = "moves-analyzer"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.140.13",
    "psycopg2-binary>=2.9.13",
    "pydantic-settings>=2.14.2",
    "python-chess>=1.999",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.3.0",
    "ruff>=0.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
